service: surebank-api
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  timeout: 90
  environment: ${file(env.json)}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:3001
        - http://localhost:8081
        - https://surebank.sonicflare.net
        - http://localhost:*
        - http://127.0.0.1:*
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
      allowCredentials: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:sb/prod/mongo-*

functions:
  api:
    handler: sls.handler
    events:
      - httpApi: '*'

plugins:
  - serverless-offline
