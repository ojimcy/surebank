service: surebank
frameworkVersion: '4'

# Serverless Dashboard disabled

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: ${self:custom.memorySize.${self:provider.stage}, 512}
  timeout: ${self:custom.timeout.${self:provider.stage}, 90}
  environment: ${file(env-wrapper.js)}
  httpApi:
    cors:
      allowedOrigins:
        - 'https://surebankstores.ng'
        - 'https://admin.surebankstores.ng'
        - 'https://stores.surebankstores.ng'
        - 'http://localhost:8081'
        - 'http://localhost:8080'
        - 'http://localhost:3001'
        - 'http://localhost:3000'
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - X-App-Platform
        - X-Mobile-App
        - X-Paystack-Signature
        - User-Agent
      allowCredentials: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::surebank-kyc-documents/*
        # SES permissions removed - now using Mailjet for email delivery

# Disable esbuild for now
build:
  esbuild: false

# Efficient packaging
package:
  individually: true
  patterns:
    - '!node_modules/aws-sdk/**'
    - '!node_modules/.bin/**'
    - '!node_modules/**/test/**'
    - '!node_modules/**/docs/**'
    - '!node_modules/**/examples/**'
    - '!node_modules/**/*.md'
    - '!node_modules/**/*.ts'
    - '!tests/**'
    - '!coverage/**'
    - '!.husky/**'
    - '!.git/**'
    - '!.github/**'
    - '!docs/**'
    - '!**/*.test.js'
    - '!webpack.config.js'

layers:
  dependencies:
    path: layers/dependencies
    description: Common dependencies for Surebank API
    compatibleRuntimes:
      - nodejs22.x

functions:
  api:
    handler: sls.handler
    events:
      - httpApi: '*'
    layers:
      - !Ref DependenciesLambdaLayer
  
  processScheduledContributions:
    handler: sls.processScheduledContributions
    timeout: 900  # 15 minutes
    memorySize: 1024
    events:
      - schedule: 
          rate: cron(0 6 * * ? *)  # Run daily at 6 AM UTC
          description: 'Process scheduled contributions daily at 6 AM UTC'
          enabled: true
    layers:
      - !Ref DependenciesLambdaLayer

custom:
  memorySize:
    dev: 512
    prod: 1024
  timeout:
    dev: 29
    prod: 29
  nodeEnv:
    dev: development
    prod: production

plugins:
  - serverless-offline
