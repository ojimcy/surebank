service: surebank-api
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  # timeout: 90
  environment: ${file(env.json)}
  httpApi:
    cors:
      allowedOrigins:
        - 'https://surebank.ng'
        - 'https://localhost'
        - 'https://localhost:8081'
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - X-App-Platform
        - X-Mobile-App
        - X-Paystack-Signature
        - User-Agent
      allowCredentials: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:sb/prod/mongo-*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::surebank-kyc-documents/*

functions:
  api:
    handler: sls.handler
    events:
      - httpApi: '*'

plugins:
  - serverless-offline
